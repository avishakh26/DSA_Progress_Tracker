name: Release

# Pushing a tag like v1.0.1 builds the Windows exe and publishes it as a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run tests
        shell: bash
        run: ./mvnw -B test

      - name: Build exe (bundled Java runtime)
        shell: pwsh
        run: ./package-exe.ps1

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path 'dist\DSA Progress Tracker' -DestinationPath "DSA-Progress-Tracker-${{ github.ref_name }}-windows.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: DSA-Progress-Tracker-${{ github.ref_name }}-windows.zip
          generate_release_notes: true
