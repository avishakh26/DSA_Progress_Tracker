name: Release

# Pushing a tag like v1.0.2 builds the installer + portable zip and publishes a GitHub Release.
# Pushing the `installer-test` branch does the same build but only uploads a workflow artifact.
on:
  push:
    tags: ['v*']
    branches: ['installer-test']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run tests
        shell: bash
        run: ./mvnw -B test

      - name: Install WiX Toolset 3 (needed by jpackage for the .exe installer)
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
          }
          $wix = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset*' | Select-Object -First 1
          if ($wix) { Add-Content $env:GITHUB_PATH (Join-Path $wix.FullName 'bin') }

      - name: Build installer and portable app
        shell: pwsh
        run: ./package-exe.ps1 -Installer

      - name: Zip portable version
        shell: pwsh
        run: |
          $v = [regex]::Match((Get-Content 'src\main\java\com\dsatracker\util\AppConstants.java' -Raw), 'APP_VERSION\s*=\s*"([^"]+)"').Groups[1].Value
          Compress-Archive -Path 'dist\DSA Progress Tracker' -DestinationPath "DSA-Progress-Tracker-v$v-portable-windows.zip"
          Copy-Item "dist\DSA-Progress-Tracker-Setup-$v.exe" .

      - name: Upload build (test branch only)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            DSA-Progress-Tracker-Setup-*.exe
            DSA-Progress-Tracker-*-portable-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DSA-Progress-Tracker-Setup-*.exe
            DSA-Progress-Tracker-*-portable-windows.zip
          generate_release_notes: true
